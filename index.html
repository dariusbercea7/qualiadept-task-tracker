  <body>
    <header>
      <h1>Login Page Task Traker</h1>
    </header>
    <main>

      <div class="login-container">
        <form id="login-credentials">
          <label for="login-email">Email:</label>
          <input type="email" id="login-email" data-testid="input-email" placeholder="ion@gmail.com" required>
          <label for="login-password"> Password</label>
          <input type="password" id = "login-password" data-testid="input-password" required>
          <button type="submit" id="login-btn" data-testid="btn-submit-login">Log in</button>

        </form>
      </div>
    </main>
